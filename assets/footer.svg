<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1522" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2CBF">
        <animate attributeName="stop-color" values="#7B2CBF; #00F5D4; #F72585; #4361EE; #7B2CBF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00F5D4">
        <animate attributeName="stop-color" values="#00F5D4; #F72585; #7B2CBF; #00BBF9; #00F5D4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#F72585">
        <animate attributeName="stop-color" values="#F72585; #7B2CBF; #00F5D4; #F72585; #F72585" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Heartbeat / Wave Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .quote-text { font-family: 'Georgia', serif; font-style: italic; font-size: 15px; fill: #e2e8f0; }
    .author-text { font-family: 'Fira Code', monospace; font-size: 12px; fill: #00F5D4; font-weight: 600; }
    .credit-text { font-family: 'Fira Code', monospace; font-size: 12px; fill: #94a3b8; }
    .hud-text { font-family: 'Fira Code', monospace; font-size: 11px; fill: #475569; }

    @keyframes pulseLine {
      0% { stroke-dashoffset: 400; opacity: 0.3; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -400; opacity: 0.3; }
    }
    .pulse-wave {
      stroke-dasharray: 200;
      animation: pulseLine 5s linear infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blinkCursor 1s infinite;
      fill: #00F5D4;
    }
  </style>

  <!-- Outer Card -->
  <rect x="5" y="5" width="840" height="130" rx="14" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="2.5" />

  <!-- Corner Brackets (Cyber HUD Aesthetics) -->
  <path d="M 18 20 L 18 12 L 26 12" fill="none" stroke="#00F5D4" stroke-width="2" />
  <path d="M 832 20 L 832 12 L 824 12" fill="none" stroke="#00F5D4" stroke-width="2" />
  <path d="M 18 118 L 18 126 L 26 126" fill="none" stroke="#F72585" stroke-width="2" />
  <path d="M 832 118 L 832 126 L 824 126" fill="none" stroke="#F72585" stroke-width="2" />

  <!-- Center Heartbeat / Wave Line -->
  <path d="M 35 48 L 300 48 L 320 30 L 335 65 L 350 40 L 365 52 L 380 48 L 815 48" 
        fill="none" 
        stroke="#00F5D4" 
        stroke-width="1.8" 
        class="pulse-wave" 
        filter="url(#cyanGlow)" />

  <!-- Main Quote -->
  <text x="425" y="80" text-anchor="middle" class="quote-text">
    “The best way to predict the future is to invent it.”
  </text>
  <text x="425" y="100" text-anchor="middle" class="author-text">
    — Alan Kay <tspan fill="#64748b">|</tspan> <tspan fill="#F72585">Turing Award Laureate</tspan>
  </text>

  <!-- Bottom Info & Heartbeat Status -->
  <text x="35" y="122" class="hud-text">
    LATENCY: 12ms <tspan fill="#64748b">|</tspan> STATUS: READY_TO_BUILD<tspan class="cursor">_</tspan>
  </text>

  <text x="815" y="122" text-anchor="end" class="credit-text">
    Built with 💜 by <tspan fill="#FFFFFF" font-weight="700">Harshil Rana</tspan>
  </text>
</svg>

